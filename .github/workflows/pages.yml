# Publishes a static preview of the website to GitHub Pages on every push to the
# branches listed below (or on demand from the Actions tab, for any listed branch).
# The pages use the starting content in scripts/seed-data/ — there's no CMS on the
# preview, so edits made in /admin on another copy of the site don't appear here.
# Forms are switched off.
#
# A repo has ONE Pages site: whichever listed branch was pushed last is what's live.
#
# One-time setup (GitHub website):
#   1. Settings → Pages → Source: "GitHub Actions" (NOT "Deploy from a branch", which
#      would serve the raw source files instead of the built site).
#   2. Settings → Environments → github-pages → Deployment branches: add every branch
#      listed below. By default only the default branch may deploy, and the deploy
#      job fails with "Branch … is not allowed to deploy to github-pages".
name: Website preview (GitHub Pages)

on:
  push:
    branches: [main, UI]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./.data/preview.db
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Load the starting content into a temporary database
        run: mkdir -p .data && npm run seed

      - name: Build the static pages
        run: npm run build:pages
        env:
          # e.g. "/TVC-website" — the sub-folder GitHub Pages serves this repo from.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
